[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawline"
version = "0.1.0"
description = "Minimal scaffold for PawLine veterinary intake and escalation AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openai>=3.19.2",
    "pydantic>=2.8.0,<3.0.0",
    "pyjwt>=2.14.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.setuptools]
packages = ["app", "app.models", "app.integrations", "mock_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
