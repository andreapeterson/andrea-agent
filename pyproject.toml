[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawline"
version = "0.1.0"
description = "Minimal scaffold for PawLine veterinary intake and escalation AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "openai>=3.50.0",
    "pydantic>=2.8.0,<3.0.0",
    "pyjwt>=2.15.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.17.5",
]

[tool.setuptools]
packages = ["app", "app.agents", "app.models", "app.integrations", "app.prompts", "mock_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Security floors for existing transitive dependencies, not new direct dependencies.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "dnspython>=2.9.2",
]
