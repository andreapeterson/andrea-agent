name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, deterministic tests, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          # Test the minimum supported Python from pyproject.toml (>=3.12).
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        id: sync
        run: uv sync --locked

      # Run every gate after a successful install, even if an earlier gate fails.
      # Each command's nonzero exit still fails the job.
      - name: Ruff
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check .

      - name: Deterministic tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest

      - name: Audit installed dependencies
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pip-audit
